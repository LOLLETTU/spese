<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<title>Spese di viaggio</title>
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<main id="app" class="app" aria-live="polite"></main>

<div class="sheet-overlay" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
